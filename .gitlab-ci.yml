image: python:3.14

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_LINK_MODE: copy
  UV_PROJECT_ENVIRONMENT: ".venv"
  UV_CACHE_DIR: .uv-cache
  #UV_NO_SOURCES: true
  DEPLOYMENT_DIR: "/data/academic-api"

  AAPI_WWW_DIR:
    description: "Absolute path on server to public_html for frontend"
    value: "/var/www/aapi"
  VITE_AAPI_UI_URL:
    description: "Complete URL to web UI"
    value: "http://127.0.0.1:8080"
  VITE_AAPI_API_URL:
    description: "Complete URL to api"
    value: "http://127.0.0.1:8081"
  NODE_ENV: "development"
  # Where build-frontend puts (and deploy-web-to-production expects) the static files
  WEB_ARTIFACT_DIR: "$CI_PROJECT_DIR/frontend/dist"


before_script:
  # Provides credentials to pip to access private GitLab PyPi index.
  - echo "machine gitlab.pik-potsdam.de" > ~/.netrc
  - echo "  login gitlab-ci-token" >> ~/.netrc
  - echo "  password ${CI_JOB_TOKEN}" >> ~/.netrc

stages:
  - build
  - test
  - deploy

cache:
  - key:
      files:
        - uv.lock
    paths:
      - $UV_CACHE_DIR

.uv:
  tags:
    - se164-docker
  before_script:
    - echo "UV_NO_SOURCES is $UV_NO_SOURCES"
    - git config --global url."https://gitlab.pik-potsdam.de/".insteadOf "ssh://git@gitlab.pik-potsdam.de/"
    - pip install uv
    - python -V
    - pwd
    - ls -lisah
    - uv sync --frozen --group dev
  after_script:
    - uv cache prune --ci

.npm:
  image: node:26-alpine
  tags:
    - se164-docker
  variables:
    # Keep the npm cache in the project root so it matches the cache paths below
    # (before_script changes into frontend/).
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  before_script:
    - cd frontend
    - npm ci
    - npm ls
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm/

pre-uv:
  extends: .uv
  stage: build
  script:
    - uv pip freeze

pre-npm:
  extends: .npm
  stage: build
  script:
    - echo "Building the static sources"
    - npx npm-check-updates

test-ruff:
  extends: .uv
  stage: test
  script:
    - uv run ruff check
    - uv run ruff format --check

test-pytest:
  extends: .uv
  stage: test
  allow_failure: true
  script:
    - uv run pytest

test-mypy:
  extends: .uv
  stage: test
  allow_failure: true
  script:
    - uv run mypy

test-frontend:
  stage: test
  extends: .npm
  script:
    - npm run format:check
    - npm run lint
    - npm run typecheck

build-frontend:
  extends: .npm
  stage: build
  script:
    - export NODE_ENV=production
    - npm run build
    - ls -lisah dist
  artifacts:
    name: "frontend-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 day
    paths:
      # vite builds into frontend/dist and artifact paths are relative to CI_PROJECT_DIR
      - frontend/dist/
  only:
    - production

deploy-web-to-production:
  tags:
    - se164-bare
  stage: deploy
  dependencies:
    - build-frontend
  script:
    - echo "Deploying to production"
    - pwd
    - ls -lisah
    - ls -lisah "${WEB_ARTIFACT_DIR}"
    - sudo /usr/bin/chown -R gitlab-runner "${AAPI_WWW_DIR}"
    - rsync -av --delete "${WEB_ARTIFACT_DIR}/" "${AAPI_WWW_DIR}"
    - sudo /usr/bin/chown -R nacsos "${AAPI_WWW_DIR}"
  when: manual
  only:
    - production

deploy-api-to-production:
  stage: deploy
  tags:
    - se164-bare
  script:
    - echo "Current working directory and user"
    - pwd
    - whoami
    - groups
    - echo $HOME
    - echo "Go to deployment location"
    - echo "Stopping core service"
    - sudo systemctl stop academic-api.service
    - cd "${DEPLOYMENT_DIR}"
    - pwd
    - sudo chown -R gitlab-runner "${DEPLOYMENT_DIR}"
    - ls -lisah
    - echo "Fetching updated source"
    - git stash  # "reset" softly by stashing (in case files changed)
    - git pull pik main
    - sudo chown -R nacsos "${DEPLOYMENT_DIR}"
    - echo "Creating new virtual environment"
    - sudo -u nacsos /usr/bin/bash -c "uv sync --frozen --reinstall --cache-dir .cache"
    - echo "Starting core service"
    - sudo systemctl start academic-api.service
  when: manual
  only:
    - production


restart-workers:
  stage: deploy
  tags:
    - se164-bare
  script:
    - echo "Restarting worker service"
    - sudo systemctl restart academic-api-worker.service
  when: manual
  only:
    - production
