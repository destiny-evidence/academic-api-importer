[project]
name = "academic-apis"
version = "0.1.0"
description = "This toolkit provides wrappers to interact with APIs of academic literature databases, such as Scopus, Web of Science, PubMed, and others."
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [
    { name = "Tim Repke", email = "tim.repke@pik-potsdam.de" }
]

dependencies = [
    "destiny-sdk[labs]>=0.16.0",
    "nacsos_data",
    "taskiq>=0.12.5",
    #"taskiq-dashboard==0.4.4",
    #"taskiq-admin",
    "filelock>=3.32.4",
    "sqlmodel>=0.0.39",
    "pandas[excel]>=3.0.0",
    "fastapi[standard]>=0.141.1",
    "orjson>=3.11.0",
    "socksio==1.*",
    "jinja2>=3.1.6",
]
[tool.uv.sources]
#nacsos_data = { git = "https://gitlab.pik-potsdam.de/mcc-apsis/nacsos/nacsos-data.git", tag = "v0.24.55" }
nacsos_data = { git = "git+ssh://git@gitlab.pik-potsdam.de/mcc-apsis/nacsos/nacsos-data.git", tag = "v0.24.55" }

[dependency-groups]
dev = [
    "academic-apis",
    "mypy>=1.14.1,<2",
    "pre-commit>=4.2.0,<5",
    "ruff>=0.8.6,<0.20",
]

[tool.fastapi]
entrypoint = "academic_apis.api:api"

#[project.scripts]
#api = "academic_apis.api:serve"

[build-system]
requires = ["uv_build>=0.11.31,<0.13.0"]
build-backend = "uv_build"


[tool.ruff]
fix = false
target-version = "py314"
lint.ignore = [
    "ANN001", # Missing type annotation for function argument `_`
    "B009",
    "B010",
    "COM812", # trailing commas (ruff-format recommended)
    "CPY001", # Missing copyright notice at top of file
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D107", # Missing docstring in `__init__`
    "D203", # no-blank-line-before-class
    "D205", # 1 blank line required between summary line and description
    "D212", # multi-line-summary-first-line
    "D400", # First line should end with a period
    "D401", # First line of docstring should be in imperative mood: "Runs startup events for client and worker side."
    "D407", # removed dashes lines under sections
    "D415", # First line should end with a period, question mark, or exclamation point
    "D417", # argument description in docstring (unreliable)
    "E203",
    "E501",
    "E712",
    "E741",
    "EM101", # Exception must not use a string literal, assign to variable first
    "EM102", # Exception must not use an f-string literal, assign to variable first
    "ERA001", # Found commented-out code
    "FBT001", # Boolean-typed positional argument in function definition
    "FBT002", # Boolean default positional argument in function definition
    "FIX002", # implicit trust that TODOs are not trivial, or else they would be fixed
    "G004", # Logging statement uses f-string
    "ISC001", # simplify implicit str concatenation (ruff-format recommended)
    "PLC0415", # `import` should be at the top-level of a file
    "PLR0911", # Too many return statements (7 > 6)
    "PLR0913", # Too many arguments in function definition (7 > 5)
    "PLR0917", # Too many positional arguments (7 > 5)
    "TC001", # Move application import `academic_apis.utils.types.Wrapper` into a type-checking block
    "TC002", # Move third-party import `httpx.Response` into a type-checking block
    "TC003", # Move standard library import `pathlib.Path` into a type-checking block
    "TD002", # Missing author in TODO;
    "TD003", # Missing issue link for this TODO
    "TRY003", # Avoid specifying long messages outside the exception class
    "TRY201", # Use `raise` without specifying exception name
    "TRY300", # Consider moving this statement to an `else` block
    "TRY401", # Redundant exception object included in `logging.exception` call
    "UP042", # Class Wrapper inherits from both `str` and `enum.Enum`
]
lint.select = ["ALL"]
lint.mccabe.max-complexity = 18
lint.pep8-naming.classmethod-decorators = ["classmethod"]
lint.pylint.max-branches = 20

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "sqlmodel.SQLModel"]
runtime-evaluated-decorators = ["pydantic.validate_call"]



[tool.mypy]
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
strict = true
follow_imports = "silent"
check_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
no_implicit_reexport = false
strict_optional = true
explicit_package_bases = false
show_traceback = true
incremental = false

files = ['src/']
exclude = [
    'scripts\/.*'
]

# for strict mypy: (this is the tricky one :-))
disallow_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.tomlsort]
all = true
spaces_indent_inline_array = 4
trailing_comma_inline_array = true
overrides."project.classifiers".inline_arrays = false
overrides."tool.coverage.paths.source".inline_arrays = false

[tool.uv]
default-groups = [
    "dev",
]
exclude-dependencies = [
    "ecdsa", # Required until https://github.com/mpdavis/python-jose/issues/390 is resolved
]
package = true

