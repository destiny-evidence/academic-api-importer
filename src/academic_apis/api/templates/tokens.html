<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tokens</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-light">
    <div class="container py-5" x-data="{ search: '' }">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3">Access Tokens</h1>
            <input type="text" x-model="search" class="form-control w-25" placeholder="Filter tokens...">
        </div>
        
        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Token ID</th>
                            <th>Wrapper</th>
                            <th>Comment</th>
                            <th>Last Used</th>
                            <th>Last Feedback</th>
                            <th>Locked Until</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for token in tokens %}
                        <tr x-show="'{{ token.token_id }} {{ token.wrapper }} {{ token.comment }}'.toLowerCase().includes(search.toLowerCase())">
                            <td><code>{{ token.token_id }}</code></td>
                            <td><span class="badge bg-primary">{{ token.wrapper }}</span></td>
                            <td>{{ token.comment or '-' }}</td>
                            <td>{{ token.last_used or '-' }}</td>
                            <td>{{ token.last_feedback or '-' }}</td>
                            <td>{{ token.locked_until or '-' }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
