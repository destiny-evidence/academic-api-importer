<!-- base.html -->
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Home{% endblock %} | FastAPI-Jinja2-Postgres Webapp</title>

    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">
    <meta name="csrf-token" content="{{ request.state.csrf_token }}">
    <!-- Scripts in <head> with defer so they are NOT re-processed during
         htmx hx-boost body swaps. This keeps our component JS (ui.js) and its
         document-level event delegation working across AJAX navigations. defer
         maintains execution order and waits for DOM parsing to complete. -->
    <link href="{{ request.url_for('static', path='css/bootstrap.min.css') }}" rel="stylesheet">
    <script defer src="{{ request.url_for('static', path='js/bootstrap.js') }}"></script>
    <script defer src="{{ request.url_for('static', path='alpine.3.x.x.js') }}"></script>

    {% block extra_head %}{% endblock %}
</head>
<body class="min-vh-100 d-flex flex-column bg-light">
    <div id="toast-container"
         class="toast-container position-fixed bottom-0 end-0 p-3"
         hx-ext="remove-me"
         aria-live="polite">
      {% set flash = request.state.flash %}
      {% if flash %}
      <div class="toast align-items-center text-bg-{{ flash.level|default('success') }} border-0 show"
           role="alert" aria-atomic="true" remove-me="5s">
        <div class="d-flex">
          <div class="toast-body">{{ flash.message }}</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto"
                  data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>
      {% endif %}
    </div>

    <header>
        <!-- Common header content -->
        {% include 'partials/header.html' %}
    </header>

    <main class="flex-grow-1">
        {% block content %}
        <!-- Page-specific content goes here -->
        {% endblock %}
    </main>

    <footer>
        <!-- Common footer content -->
        {% include 'partials/footer.html' %}
    </footer>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
